<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio</title>

  <style>
    body {
      margin: 0;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #11141c;
      padding: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .nav button {
      display: block;
      width: 100%;
      margin: 7px 0;
      padding: 12px;
      background: #1a1e28;
      color: white;
      border: 0;
      border-radius: 8px;
      text-align: left;
    }

    .main {
      flex: 1;
      padding: 30px;
    }

    .card {
      max-width: 850px;
      background: #141821;
      border: 1px solid #292e3a;
      border-radius: 14px;
      padding: 25px;
    }

    textarea {
      width: 100%;
      height: 160px;
      box-sizing: border-box;
      margin: 15px 0;
      padding: 15px;
      background: #0c0f15;
      color: white;
      border: 1px solid #303644;
      border-radius: 8px;
    }

    button.generate {
      padding: 13px 22px;
      background: #705cff;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
    }

    #result img {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">AI Studio</div>

    <div class="nav">
      <button>💬 Chat</button>
      <button>👤 Charaktere</button>
      <button>🖼️ Bilder</button>
      <button>🎬 Videos</button>
      <button>🗂️ Galerie</button>
      <button>📦 Export</button>
      <button>⚙️ Provider</button>
    </div>
  </aside>

  <main class="main">

    <h1>AI Studio</h1>

    <div class="card">

      <h2>Neues Bild</h2>

      <textarea
        id="prompt"
        placeholder="Beschreibe dein Bild..."
      ></textarea>

      <button class="generate" onclick="generate()">
        Bild generieren
      </button>

      <div id="status"></div>

      <div id="result"></div>

    </div>

  </main>

</div>

<script>
async function generate() {

  const prompt =
    document.getElementById("prompt").value.trim();

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  if (!prompt) {
    status.textContent =
      "Bitte zuerst einen Prompt eingeben.";
    return;
  }

  status.textContent =
    "Bild wird generiert...";

  result.innerHTML = "";

  try {

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const raw = await response.text();

    console.log("SERVER:", raw);

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      status.textContent =
        "SERVER-ANTWORT:\n" + raw;
      return;
    }

    if (!response.ok) {
      status.textContent =
        "FEHLER:\n" +
        (data.error || JSON.stringify(data));
      return;
    }

    status.textContent =
      "Antwort erhalten.";

    if (Array.isArray(data.output)) {

      for (const url of data.output) {

        const img =
          document.createElement("img");

        img.src = url;

        result.appendChild(img);
      }

    } else if (typeof data.output === "string") {

      const img =
        document.createElement("img");

      img.src = data.output;

      result.appendChild(img);

    } else {

      status.textContent =
        "Replicate-Antwort:\n" +
        JSON.stringify(data, null, 2);
    }

  } catch (error) {

    status.textContent =
      "FEHLER:\n" +
      error.message;
  }
}
</script>

</body>
</html>
