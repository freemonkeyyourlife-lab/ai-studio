<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 230px;
      background: #11141c;
      padding: 24px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .nav button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 8px;
      background: #1b1f29;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .card {
      max-width: 900px;
      padding: 25px;
      border-radius: 14px;
      background: #141821;
      border: 1px solid #292e3a;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      margin: 15px 0;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid #303644;
      background: #0c0f15;
      color: white;
      font-size: 16px;
    }

    .generate {
      padding: 13px 22px;
      border: 0;
      border-radius: 8px;
      background: #705cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      color: #aaa;
    }

    #result {
      margin-top: 25px;
      max-width: 100%;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">AI Studio</div>

    <div class="nav">
      <button>💬 Chat</button>
      <button>👤 Charaktere</button>
      <button>🖼️ Bilder</button>
      <button>🎬 Videos</button>
      <button>🗂️ Galerie</button>
      <button>📦 Export</button>
      <button>⚙️ Provider</button>
    </div>
  </aside>

  <main class="main">

    <h1>AI Studio</h1>

    <div class="card">

      <h2>Neues Bild</h2>

      <textarea
        id="prompt"
        placeholder="Beschreibe dein Bild..."
      ></textarea>

      <button
        class="generate"
        onclick="generateImage()"
      >
        Bild generieren
      </button>

      <div id="status"></div>

      <img id="result" alt="Generiertes Bild">

    </div>

  </main>

</div>

<script>
async function generateImage() {

  const prompt = document
    .getElementById("prompt")
    .value
    .trim();

  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!prompt) {
    status.textContent = "Bitte einen Prompt eingeben.";
    return;
  }

  status.textContent = "Bild wird generiert...";
  result.style.display = "none";

  try {

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Bildgenerierung fehlgeschlagen");
    }

    if (!data.image) {
      throw new Error("Kein Bild von Replicate erhalten");
    }

    result.src = data.image;
    result.style.display = "block";

    status.textContent = "Bild fertig.";

  } catch (error) {

    status.textContent = "Fehler: " + error.message;

  }
}
</script>

</body>
</html>
