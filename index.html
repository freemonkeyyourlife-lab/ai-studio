<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: white;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #11141c;
      padding: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .nav button {
      display: block;
      width: 100%;
      margin: 7px 0;
      padding: 12px;
      text-align: left;
      background: #1a1e28;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 30px;
    }

    .card {
      max-width: 850px;
      background: #141821;
      border: 1px solid #292e3a;
      border-radius: 14px;
      padding: 25px;
    }

    textarea {
      width: 100%;
      height: 160px;
      margin: 15px 0;
      padding: 15px;
      background: #0c0f15;
      color: white;
      border: 1px solid #303644;
      border-radius: 8px;
      resize: vertical;
    }

    .generate {
      padding: 13px 22px;
      background: #705cff;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">AI Studio</div>

    <div class="nav">
      <button>💬 Chat</button>
      <button>👤 Charaktere</button>
      <button>🖼️ Bilder</button>
      <button>🎬 Videos</button>
      <button>🗂️ Galerie</button>
      <button>📦 Export</button>
      <button>⚙️ Provider</button>
    </div>
  </aside>

  <main class="main">

    <h1>AI Studio</h1>
    <p>Bildgenerator</p>

    <div class="card">

      <h2>Neues Bild</h2>

      <textarea
        id="prompt"
        placeholder="Beschreibe dein Bild..."
      ></textarea>

      <button class="generate" onclick="generate()">
        Bild generieren
      </button>

      <div id="status"></div>

    </div>

  </main>

</div>

<script>
async function generate() {

  const prompt =
    document.getElementById("prompt").value.trim();

  const status =
    document.getElementById("status");

  if (!prompt) {
    status.textContent =
      "Bitte zuerst einen Prompt eingeben.";
    return;
  }

  status.textContent =
    "Auftrag wird gesendet...";

  try {

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Fehler"
      );
    }

    status.textContent =
      "Auftrag angenommen: " + data.prompt;

  } catch (error) {

    status.textContent =
      "Fehler: " + error.message;

  }
}
</script>

</body>
</html>
